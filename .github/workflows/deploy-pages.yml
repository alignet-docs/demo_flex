name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /demo_flex/
          VITE_FLEX_API_AUDIENCE: ${{ secrets.FLEX_API_AUDIENCE }}
          VITE_FLEX_ASSET_BASE_URL: ${{ secrets.FLEX_ASSET_BASE_URL }}
          VITE_FLEX_AUTH_BASE_URL: ${{ secrets.FLEX_AUTH_BASE_URL }}
          VITE_FLEX_CLIENT_ID: ${{ secrets.FLEX_CLIENT_ID }}
          VITE_FLEX_CLIENT_SECRET: ${{ secrets.FLEX_CLIENT_SECRET }}
          VITE_FLEX_MERCHANT_CODE: ${{ secrets.FLEX_MERCHANT_CODE }}
          VITE_FLEX_NONCE_SCOPE: ${{ secrets.FLEX_NONCE_SCOPE }}
          VITE_FLEX_TOKEN_SCOPE: ${{ secrets.FLEX_TOKEN_SCOPE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
